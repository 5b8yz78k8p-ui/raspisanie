<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Моё расписание</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh; padding: 20px; color: #333;
  }
  .container {
    max-width: 800px; margin: 0 auto; background: #fff;
    border-radius: 16px; padding: 25px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  h1 { text-align: center; color: #4a3f8a; margin-bottom: 20px; font-size: 26px; }
  .info { text-align: center; color: #666; margin-bottom: 20px; font-size: 14px; }
  .day-block {
    margin-bottom: 15px; padding: 12px; background: #f7f7fb;
    border-radius: 10px; border-left: 4px solid #667eea;
  }
  .day-block label {
    display: block; font-weight: bold; margin-bottom: 6px; color: #4a3f8a;
  }
  textarea {
    width: 100%; min-height: 70px; padding: 10px;
    border: 2px solid #ddd; border-radius: 8px;
    font-size: 14px; font-family: inherit; resize: vertical;
  }
  textarea:focus { outline: none; border-color: #667eea; }
  button {
    padding: 12px 24px; font-size: 16px; border: none;
    border-radius: 8px; cursor: pointer; font-weight: bold;
  }
  .btn-primary {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; width: 100%;
    box-shadow: 0 4px 15px rgba(102,126,234,0.4);
  }
  .btn-secondary { background: #eee; color: #4a3f8a; margin-right: 10px; }
  .btn-danger { background: #ff5757; color: #fff; }
  .actions { margin-top: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
  .hidden { display: none; }
  .schedule-card {
    padding: 15px; background: #f7f7fb; border-radius: 10px;
    border-left: 4px solid #764ba2; margin-bottom: 12px;
  }
  .schedule-card h3 { color: #4a3f8a; margin-bottom: 8px; font-size: 17px; }
  .schedule-card ul { list-style: none; }
  .schedule-card li {
    padding: 6px 0 6px 22px; position: relative; border-bottom: 1px dashed #ddd;
  }
  .schedule-card li:last-child { border-bottom: none; }
  .schedule-card li::before { content: "📘"; position: absolute; left: 0; }
  .empty { color: #999; font-style: italic; padding-left: 0 !important; }
  .empty::before { content: "" !important; }
</style>
</head>
<body>
<div class="container">
  <h1>📅 Моё расписание</h1>

  <!-- ФОРМА (дни прописаны прямо в HTML) -->
  <div id="editScreen">
    <p class="info" id="editInfo"></p>

    <div class="day-block"><label>Понедельник</label><textarea data-day="Понедельник"></textarea></div>
    <div class="day-block"><label>Вторник</label><textarea data-day="Вторник"></textarea></div>
    <div class="day-block"><label>Среда</label><textarea data-day="Среда"></textarea></div>
    <div class="day-block"><label>Четверг</label><textarea data-day="Четверг"></textarea></div>
    <div class="day-block"><label>Пятница</label><textarea data-day="Пятница"></textarea></div>
    <div class="day-block"><label>Суббота</label><textarea data-day="Суббота"></textarea></div>
    <div class="day-block"><label>Воскресенье</label><textarea data-day="Воскресенье"></textarea></div>

    <div class="actions">
      <button class="btn-primary" id="saveBtn">💾 Сохранить расписание</button>
    </div>
  </div>

  <!-- ПРОСМОТР -->
  <div id="viewScreen" class="hidden">
    <div id="scheduleView"></div>
    <div class="actions">
      <button class="btn-secondary" id="editBtn">✏️ Изменить</button>
      <button class="btn-danger" id="resetBtn">🗑️ Сбросить всё</button>
    </div>
  </div>
</div>

<script>
  const DAYS = ["Понедельник","Вторник","Среда","Четверг","Пятница","Суббота","Воскресенье"];
  const STORAGE_KEY = "mySchedule";

  const editScreen = document.getElementById("editScreen");
  const viewScreen = document.getElementById("viewScreen");
  const scheduleView = document.getElementById("scheduleView");
  const editInfo = document.getElementById("editInfo");

  function loadSchedule() {
    try {
      const data = localStorage.getItem(STORAGE_KEY);
      return data ? JSON.parse(data) : null;
    } catch(e) { return null; }
  }
  function saveToStorage(s) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  }
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // Заполнить textarea значениями из сохранённого расписания
  function fillForm(schedule) {
    document.querySelectorAll("textarea[data-day]").forEach(ta => {
      const day = ta.getAttribute("data-day");
      const arr = (schedule && schedule[day]) ? schedule[day] : [];
      ta.value = arr.join("\n");
    });
  }

  function showEdit(isFirstTime) {
    const schedule = loadSchedule();
    editInfo.textContent = isFirstTime
      ? "Введи своё расписание. Одно занятие — одна строка."
      : "Измени нужные дни и нажми «Сохранить».";
    fillForm(schedule);
    editScreen.classList.remove("hidden");
    viewScreen.classList.add("hidden");
  }

  function showView() {
    const schedule = loadSchedule();
    scheduleView.innerHTML = "";
    DAYS.forEach(day => {
      const lessons = (schedule && schedule[day]) ? schedule[day] : [];
      const card = document.createElement("div");
      card.className = "schedule-card";
      let listHTML = lessons.length
        ? lessons.map(l => "<li>" + escapeHtml(l) + "</li>").join("")
        : '<li class="empty">(нет занятий)</li>';
      card.innerHTML = "<h3>" + day + "</h3><ul>" + listHTML + "</ul>";
      scheduleView.appendChild(card);
    });
    editScreen.classList.add("hidden");
    viewScreen.classList.remove("hidden");
  }

  function collectForm() {
    const schedule = {};
    document.querySelectorAll("textarea[data-day]").forEach(ta => {
      const day = ta.getAttribute("data-day");
      schedule[day] = ta.value.split("\n").map(s => s.trim()).filter(s => s.length);
    });
    return schedule;
  }

  document.getElementById("saveBtn").addEventListener("click", () => {
    saveToStorage(collectForm());
    showView();
  });
  document.getElementById("editBtn").addEventListener("click", () => showEdit(false));
  document.getElementById("resetBtn").addEventListener("click", () => {
    if (confirm("Точно удалить всё расписание?")) {
      localStorage.removeItem(STORAGE_KEY);
      showEdit(true);
    }
  });

  // Запуск
  if (loadSchedule()) showView();
  else showEdit(true);
</script>
</body>
</html>
